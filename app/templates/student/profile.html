{% extends "base.html" %}

{% block title %}Student Profile{% endblock %}

{% block content %}

<div class="container py-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold mb-1">My Profile</h3>
            <p class="text-muted mb-0">
                View and update your personal information.
            </p>
        </div>

    </div>


    <!-- Profile Card -->
    <div class="card shadow-sm border-0">

        <div class="card-header bg-white py-3">
            <h5 class="mb-0">Personal Information</h5>
        </div>

        <div class="card-body p-4">

            <form method="POST"
                  action="#">

                <!-- Full Name -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Full Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ student.user.name }}"
                           required>

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Email Address
                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ student.user.email }}"
                           required>

                </div>


            

                <!-- Account Created -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Account Created
                    </label>

                    <input type="text"
                           class="form-control"
                           value="{{ student.created_at.strftime('%d-%m-%Y') }}"
                           readonly>

                </div>


                <!-- Buttons -->
                <div class="d-flex gap-2">

                <form method="POST" action="{{ url_for('student.update_student_profile') }}">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            Save Changes
                        </button>
                        <a href="{{ url_for('student.dashboard') }}"
                        class="btn btn-light border">
                            Cancel
                        </a>
                    </div>
                </form>
                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
